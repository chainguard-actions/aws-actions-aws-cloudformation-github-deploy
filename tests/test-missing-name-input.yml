name: Test missing required name input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal CloudFormation template
        run: |
          cat > /tmp/test-template.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Test stack
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF

      - name: Run action without required name input (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          template: /tmp/test-template.yaml
          # 'name' is intentionally omitted to trigger validation failure

      - name: Assert action failed due to missing name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when 'name' input is missing, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when required 'name' input was missing"
