name: Test no-execute-changeset mode with parameter overrides
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a CloudFormation template with parameters
        run: |
          mkdir -p /tmp/cfn-params-test
          cat > /tmp/cfn-params-test/template.yml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Test stack with parameters
          Parameters:
            Environment:
              Type: String
              Default: dev
            AppName:
              Type: String
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF

      # Test with parameter-overrides in comma-delimited format
      # With fake credentials, the action should fail at AWS API call (not at input validation)
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          name: test-stack-with-params
          template: /tmp/cfn-params-test/template.yml
          capabilities: CAPABILITY_IAM
          no-execute-changeset: "true"
          parameter-overrides: "Environment=staging,AppName=myapp"

      - name: Assert action failed at AWS level (not validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake AWS credentials"
            exit 1
          fi
          echo "PASS: action correctly failed at AWS level (parameter-overrides were valid)"
