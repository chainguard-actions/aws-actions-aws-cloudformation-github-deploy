name: Test basic CloudFormation deploy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key
          AWS_DEFAULT_REGION: us-east-1
        with:
          name: my-test-stack
          template: template.yaml
          capabilities: CAPABILITY_IAM
          parameter-overrides: "Env=test,Region=us-east-1"
          tags: '[{"Key":"Environment","Value":"test"}]'
          role-arn: arn:aws:iam::123456789012:role/MyRole
          notification-arns: arn:aws:sns:us-east-1:123456789012:MyTopic
          timeout-in-minutes: "10"
          fail-on-empty-changeset: false
          disable-rollback: false
          termination-protection: false
      - name: Assert action ran (may fail due to no real AWS creds)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
