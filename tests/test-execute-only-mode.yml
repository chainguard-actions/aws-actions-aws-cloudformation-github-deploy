name: Test execute-only mode fails without AWS credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in execute-only mode without AWS credentials (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: execute-only
          name: test-stack-execute-only
          execute-change-set-id: arn:aws:cloudformation:us-east-1:123456789012:changeSet/test-cs/abc123

      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail in execute-only mode without AWS credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed in execute-only mode without AWS credentials"
