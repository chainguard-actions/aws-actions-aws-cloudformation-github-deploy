name: Test execute-only mode with fake credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action in execute-only mode with a fake change set ID (expect AWS auth failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          mode: execute-only
          name: test-stack-execute-only
          execute-change-set-id: arn:aws:cloudformation:us-east-1:123456789012:changeSet/my-change-set/abc123
      - name: Assert action failed (AWS auth error expected with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake AWS credentials in execute-only mode, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when using fake AWS credentials in execute-only mode"
