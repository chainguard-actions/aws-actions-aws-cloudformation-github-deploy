name: Test S3 template upload options (s3-bucket, s3-prefix)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal CloudFormation template
        run: |
          mkdir -p /tmp/cfn-test
          cat > /tmp/cfn-test/template.yml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Test stack for S3 upload testing
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF

      # With fake credentials, the action should fail at AWS API call (not at input validation)
      # This confirms that s3-bucket and s3-prefix inputs are correctly parsed
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          name: test-stack-s3-upload
          template: /tmp/cfn-test/template.yml
          capabilities: CAPABILITY_IAM
          no-execute-changeset: "true"
          s3-bucket: my-cfn-templates-bucket
          s3-prefix: cloudformation/templates

      - name: Assert action failed at AWS level (s3 inputs were accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake AWS credentials"
            exit 1
          fi
          echo "PASS: action correctly failed at AWS level (s3-bucket and s3-prefix inputs were parsed)"
