name: Test stack creation options (notification-arns, role-arn, tags, timeout-in-minutes)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal CloudFormation template
        run: |
          mkdir -p /tmp/cfn-test
          cat > /tmp/cfn-test/template.yml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Test stack for act testing
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF

      # With fake credentials, the action should fail at AWS API call (not at input validation)
      # This confirms that notification-arns, role-arn, tags, and timeout-in-minutes inputs are parsed
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          name: test-stack-creation-options
          template: /tmp/cfn-test/template.yml
          capabilities: CAPABILITY_IAM
          no-execute-changeset: "true"
          notification-arns: "arn:aws:sns:us-east-1:123456789012:MyTopic"
          role-arn: "arn:aws:iam::123456789012:role/MyCloudFormationRole"
          tags: '[{ "Key": "Environment", "Value": "test" }, { "Key": "Project", "Value": "act-test" }]'
          timeout-in-minutes: "10"

      - name: Assert action failed at AWS level (inputs were accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake AWS credentials"
            exit 1
          fi
          echo "PASS: action correctly failed at AWS level (notification-arns, role-arn, tags, timeout-in-minutes inputs were parsed)"
