name: Test create mode without template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in create-and-execute mode without template (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-stack
          mode: create-and-execute
          # 'template' is intentionally omitted to trigger validation failure

      - name: Assert action failed due to missing template
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when 'template' is missing in create-and-execute mode, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when template was missing in create-and-execute mode"
