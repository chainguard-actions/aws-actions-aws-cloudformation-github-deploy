name: Test - Parameter Overrides Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Write a minimal CloudFormation template with a parameter
      - name: Create CFN template with parameter
        run: |
          cat > $GITHUB_WORKSPACE/test-param-template.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Test stack with parameter
          Parameters:
            EnvName:
              Type: String
              Default: dev
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          name: test-stack-params
          template: test-param-template.yaml
          capabilities: CAPABILITY_IAM
          parameter-overrides: "EnvName=production"

      - name: Assert action failed at AWS API (not at parameter parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail at the AWS API call (invalid credentials),
          # not at parameter parsing — confirming parameter-overrides was accepted.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid AWS credentials"
            exit 1
          fi
          echo "PASS: action failed at AWS API as expected (parameter-overrides was accepted)"
