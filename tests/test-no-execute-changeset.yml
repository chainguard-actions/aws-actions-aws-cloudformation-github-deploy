name: Test - No Execute Changeset Input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Write a minimal CloudFormation template
      - name: Create minimal CFN template
        run: |
          cat > $GITHUB_WORKSPACE/test-template.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Minimal test stack for no-execute-changeset test
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF

      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          name: test-stack-no-execute
          template: test-template.yaml
          capabilities: CAPABILITY_IAM
          no-execute-changeset: "1"
          no-fail-on-empty-changeset: "1"

      - name: Assert action failed at AWS API (not at input parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail at the AWS API call (invalid credentials),
          # not at input parsing — confirming inputs were accepted correctly.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid AWS credentials"
            exit 1
          fi
          echo "PASS: action failed at AWS API as expected (inputs were accepted)"
