name: Test no-execute-changeset mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in no-execute-changeset mode (expect failure due to fake AWS creds)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-stack-no-exec
          template: pristine/aws-actions--aws-cloudformation-github-deploy/v2.2.0/tests/fixtures/template.yml
          no-execute-changeset: true
          fail-on-empty-changeset: false
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1

      - name: Assert action ran (failed due to AWS, not code error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ] || [ "$OUTCOME" = "success" ]; then
            echo "PASS: action executed in no-execute-changeset mode (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
