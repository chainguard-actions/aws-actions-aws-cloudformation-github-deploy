name: Test no-execute-changeset mode with fake credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
      AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal CloudFormation template
        run: |
          cat > /tmp/template.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Test stack
          Resources:
            MyBucket:
              Type: AWS::S3::Bucket
          EOF
      - name: Run action in no-execute-changeset mode (expect AWS auth failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-stack-no-execute
          template: /tmp/template.yaml
          no-execute-changeset: true
          capabilities: CAPABILITY_IAM
      - name: Assert action failed (AWS auth error expected with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with fake AWS credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when using fake AWS credentials"
