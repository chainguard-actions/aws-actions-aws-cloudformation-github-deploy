name: Test - Template URL (S3 URL path)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          name: test-stack-url
          # Use an S3 URL — the action will skip local file reading and pass
          # this URL directly to CloudFormation. It will fail at the AWS API
          # call (invalid credentials), not at template loading.
          template: https://s3.amazonaws.com/mybucket/mytemplate.yaml
          capabilities: CAPABILITY_IAM

      - name: Assert action failed at AWS API (not at template URL parsing)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action should fail at the AWS API call (invalid credentials),
          # not at template URL parsing — confirming the S3 URL path was taken.
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid AWS credentials"
            exit 1
          fi
          echo "PASS: action failed at AWS API as expected (S3 URL template path was taken)"
