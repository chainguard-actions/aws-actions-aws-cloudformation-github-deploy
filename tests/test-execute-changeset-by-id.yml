name: Test execute-only mode with execute-change-set-id input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With fake credentials, the action should fail at AWS API call (not at input validation)
      # This confirms that execute-change-set-id is correctly parsed in execute-only mode
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          mode: execute-only
          name: test-stack-execute-by-id
          execute-change-set-id: "arn:aws:cloudformation:us-east-1:123456789012:changeSet/my-changeset/abc123"

      - name: Assert action failed at AWS level (execute-change-set-id input was accepted)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake AWS credentials"
            exit 1
          fi
          echo "PASS: action correctly failed at AWS level (execute-change-set-id input was parsed in execute-only mode)"
