name: Test - No AWS Credentials (expected failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Write a minimal CloudFormation template for the action to read
      - name: Create minimal CFN template
        run: |
          cat > /tmp/test-template.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Minimal test stack
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF
          cp /tmp/test-template.yaml $GITHUB_WORKSPACE/test-template.yaml

      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          name: test-stack-no-creds
          template: test-template.yaml
          capabilities: CAPABILITY_IAM

      - name: Assert action failed (expected - no real AWS credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to invalid AWS credentials"
            exit 1
          fi
          echo "PASS: action failed as expected with invalid credentials"
