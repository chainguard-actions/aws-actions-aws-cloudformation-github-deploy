name: Test missing required input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action without required 'name' input (expect failure)
        id: action
        uses: .
        continue-on-error: true
        # Intentionally omitting required 'name' input
        with:
          template: template.yaml

      - name: Assert action failed due to missing required input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when required 'name' input is missing, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when required 'name' input is missing"
