name: Test changeset options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-stack-cs
          template: actions/hardened/aws-actions--aws-cloudformation-github-deploy/v2.2.0/tests/fixtures/template.yml
          change-set-name: my-custom-changeset
          notification-arns: "arn:aws:sns:us-east-1:123456789012:MyTopic"
          role-arn: "arn:aws:iam::123456789012:role/MyRole"
          http-proxy: ""
          no-execute-changeset: true
          fail-on-empty-changeset: false
      - name: Assert action ran (expected to fail without AWS credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without real AWS credentials.
          # Input coverage is the goal here.
          echo "PASS: inputs were accepted"
