name: Test create-only mode input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal CloudFormation template
        run: |
          cat > /tmp/cfn-template.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Minimal test stack for create-only mode
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF

      - name: Run action in create-only mode (expect failure at AWS API, not validation)
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
        with:
          name: test-stack-create-only
          template: /tmp/cfn-template.yaml
          mode: create-only
          capabilities: CAPABILITY_IAM

      - name: Assert action failed (should fail at AWS API, not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (no AWS credentials), but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at AWS API level (not at input validation)"
