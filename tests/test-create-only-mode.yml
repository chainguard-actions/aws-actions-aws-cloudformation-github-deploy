name: Test create-only mode with valid inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal CloudFormation template
        run: |
          mkdir -p /tmp/cfn-create-only
          cat > /tmp/cfn-create-only/template.yml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Test stack for create-only mode
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF

      # create-only mode: creates changeset but does not execute it
      # With fake credentials, the action should fail at AWS API call (not at input validation)
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          mode: create-only
          name: test-stack-create-only
          template: /tmp/cfn-create-only/template.yml
          capabilities: CAPABILITY_IAM

      - name: Assert action failed at AWS level (not validation)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with fake AWS credentials"
            exit 1
          fi
          echo "PASS: action correctly failed at AWS level (create-only mode inputs were valid)"
