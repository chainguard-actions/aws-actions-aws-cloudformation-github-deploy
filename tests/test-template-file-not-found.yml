name: Test template file not found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with non-existent template file (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-stack
          template: /tmp/this-file-does-not-exist-12345.yaml

      - name: Assert action failed due to missing template file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when template file does not exist, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when template file was not found"
