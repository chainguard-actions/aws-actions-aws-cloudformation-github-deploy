name: Test advanced CloudFormation deploy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create minimal CloudFormation template
        run: |
          mkdir -p /tmp/cfn
          cat > /tmp/cfn/template-advanced.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Test stack with parameters
          Parameters:
            EnvName:
              Type: String
              Default: test
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key
        with:
          name: test-stack-advanced
          template: /tmp/cfn/template-advanced.yaml
          capabilities: CAPABILITY_IAM,CAPABILITY_NAMED_IAM
          parameter-overrides: "EnvName=production"
          role-arn: "arn:aws:iam::123456789012:role/CloudFormationRole"
          tags: '[{"Key":"Environment","Value":"test"},{"Key":"Project","Value":"demo"}]'
          notification-arns: "arn:aws:sns:us-east-1:123456789012:my-topic"
          timeout-in-minutes: "30"
          no-execute-changeset: "1"
          no-fail-on-empty-changeset: "1"
      - name: Assert action was invoked with advanced inputs
        run: |
          echo "Action completed (may fail due to no real AWS credentials)"
          echo "PASS: advanced inputs were accepted"
