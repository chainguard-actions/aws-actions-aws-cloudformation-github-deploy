name: Test invalid mode value fails validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal CloudFormation template
        run: |
          mkdir -p /tmp/cfn-mode-test
          cat > /tmp/cfn-mode-test/template.yml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Test stack for mode validation
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF

      # mode only accepts 'create-and-execute', 'create-only', or 'execute-only'
      # Passing an invalid value should fail validation
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          AWS_DEFAULT_REGION: us-east-1
        with:
          name: test-stack-mode-validation
          template: /tmp/cfn-mode-test/template.yml
          mode: invalid-mode-value

      - name: Assert action failed due to invalid mode
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid mode value"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid mode value"
