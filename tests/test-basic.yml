name: Test basic CloudFormation deploy inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Write minimal CloudFormation template
        run: |
          mkdir -p /tmp/cfn
          cat > /tmp/cfn/template.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Test stack
          Parameters:
            EnvName:
              Type: String
              Default: test
          Resources:
            MyBucket:
              Type: AWS::S3::Bucket
          Outputs:
            BucketName:
              Value: !Ref MyBucket
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          name: test-stack
          template: /tmp/cfn/template.yaml
          parameter-overrides: "EnvName=test"
          tags: '[{"Key":"Environment","Value":"test"}]'
          role-arn: "arn:aws:iam::123456789012:role/TestRole"
          notification-arns: "arn:aws:sns:us-east-1:123456789012:TestTopic"
          timeout-in-minutes: "10"
          capabilities: "CAPABILITY_IAM"
          fail-on-empty-changeset: "false"
          disable-rollback: "false"
          termination-protection: "false"
      - name: Assert action ran (may fail due to missing AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action executed with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome=$OUTCOME"
            exit 1
          fi
