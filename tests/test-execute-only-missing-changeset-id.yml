name: Test execute-only mode requires execute-change-set-id
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # execute-only mode requires execute-change-set-id - omitting it should fail validation
      - id: action
        uses: .
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: fake-key-id
          AWS_SECRET_ACCESS_KEY: fake-secret-key
          AWS_DEFAULT_REGION: us-east-1
        with:
          mode: execute-only
          name: my-test-stack
          # execute-change-set-id is intentionally omitted

      - name: Assert action failed due to missing execute-change-set-id
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when 'execute-change-set-id' is missing in execute-only mode"
            exit 1
          fi
          echo "PASS: action correctly failed when required 'execute-change-set-id' was missing in execute-only mode"
