name: Test execute-only mode without change set ID
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action in execute-only mode without execute-change-set-id (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-stack
          mode: execute-only
          # 'execute-change-set-id' is intentionally omitted to trigger validation failure

      - name: Assert action failed due to missing execute-change-set-id
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when 'execute-change-set-id' is missing in execute-only mode, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when execute-change-set-id was missing in execute-only mode"
