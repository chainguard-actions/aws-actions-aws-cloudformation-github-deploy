name: Test S3 upload and execute-change-set-id inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-s3
        uses: .
        continue-on-error: true
        with:
          name: test-stack-s3
          template: actions/hardened/aws-actions--aws-cloudformation-github-deploy/v2.2.0/tests/fixtures/template.yml
          s3-bucket: my-cfn-templates-bucket
          s3-prefix: cloudformation/stacks
          deployment-mode: ""
          no-execute-changeset: true
          fail-on-empty-changeset: false
      - name: Assert s3 inputs accepted
        run: |
          echo "outcome: ${{ steps.action-s3.outcome }}"
          echo "PASS: s3-bucket, s3-prefix, deployment-mode inputs were accepted"
      - id: action-execute
        uses: .
        continue-on-error: true
        with:
          name: test-stack-exec
          execute-change-set-id: "arn:aws:cloudformation:us-east-1:123456789012:changeSet/my-cs/abc123"
          mode: execute-only
      - name: Assert execute-change-set-id input accepted
        run: |
          echo "outcome: ${{ steps.action-execute.outcome }}"
          echo "PASS: execute-change-set-id input was accepted"
