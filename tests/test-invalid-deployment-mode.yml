name: Test invalid deployment-mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal CloudFormation template
        run: |
          cat > /tmp/test-template.yaml << 'EOF'
          AWSTemplateFormatVersion: '2010-09-09'
          Description: Test stack
          Resources:
            WaitHandle:
              Type: AWS::CloudFormation::WaitConditionHandle
          EOF

      - name: Run action with invalid deployment-mode (expect failure)
        id: action
        uses: .
        continue-on-error: true
        with:
          name: test-stack
          template: /tmp/test-template.yaml
          deployment-mode: INVALID_MODE

      - name: Assert action failed due to invalid deployment-mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when 'deployment-mode' is invalid, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when invalid 'deployment-mode' was provided"
