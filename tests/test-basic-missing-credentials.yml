name: Test basic - missing AWS credentials error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action and capture failure
        id: action
        uses: .
        continue-on-error: true
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
          AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        with:
          name: test-stack
          template: https://s3.amazonaws.com/cloudformation-templates-us-east-1/WordPress_Single_Instance.template
          capabilities: CAPABILITY_IAM
          no-execute-changeset: "1"

      - name: Assert action failed (no real AWS credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without real AWS credentials, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without valid AWS credentials"
