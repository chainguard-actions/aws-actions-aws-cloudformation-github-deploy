on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

name: Check

permissions:
  contents: read

jobs:
  check:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
      - name: Use Node.js 20.x
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3
        with:
          node-version: 20.x
      - name: Run tests
        run: |
          npm ci
          npm test
          npm run all
